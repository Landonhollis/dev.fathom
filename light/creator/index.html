<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fathom Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,100..900;1,100..900&family=Big+Shoulders:opsz,wght@10..72,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Cinzel:wght@400..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Overpass:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="theme-light">
    <div class="page">
      <header class="site-header">
        <div class="brand"><span class="brand-mark">f</span><span class="brand-name">fathom creator</span></div>
        <nav class="nav">
          <a href="/">Overview</a>
          <a href="/light/wealth">Finance</a>
          <a href="/dark/portfolio">Portfolio</a>
        </nav>
        <button class="nav-cta" type="button">Start portfolio</button>
      </header>

      <main>
        <section class="hero">
          <div>
            <p class="kicker">Creator portfolio</p>
            <h1 class="display bricolage">Show your work like a product.</h1>
            <p class="lede inter">Show other engineers your finished work, progress logs, and collaborations in a personal website portfolio.</p>
            <div class="cta-row">
              <button class="primary-btn inter" type="button">View work</button>
              <button class="secondary-btn inter" type="button">Book a call</button>
            </div>
            <div class="meta-strip inter">
              <div><strong>12</strong><span>Projects</span></div>
              <div><strong>3</strong><span>Years</span></div>
              <div><strong>24/7</strong><span>Visible</span></div>
            </div>
          </div>

          <div class="hero-device">
            <div class="device-frame">
              <div class="device-notch"></div>
              <div class="screen-screen">
                <div class="mini-header">
                  <span class="mini-logo">f</span>
                  <span class="mini-text">Portfolio</span>
                </div>
                <div class="mini-card">
                  <small>Featured build</small>
                  <strong>Infra OS</strong>
                  <span>2026 case study</span>
                </div>
                <div class="mini-grid">
                  <div class="mini-tile"></div>
                  <div class="mini-tile"></div>
                  <div class="mini-tile wide"></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
